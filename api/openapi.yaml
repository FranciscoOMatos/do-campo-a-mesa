openapi: 3.0.3

info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: API REST do mercado digital de produtores locais.

servers:
  - url: http://localhost:3000/api

paths:
  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar utilizador
      description: >
        Cria uma conta de comprador ou produtor.
        Não é permitido criar contas de administrador através deste endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Utilizador registado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: Email já registado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão iniciada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Obter utilizador autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados públicos do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          description: Token em falta, inválido ou sessão inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      description: Lista produtos com pesquisa, filtros e ordenação.
      parameters:
        - name: q
          in: query
          description: Texto a pesquisar no nome do produto.
          schema:
            type: string

        - name: categoria
          in: query
          schema:
            type: string
            enum:
              - Hortícolas
              - Fruta
              - Mel
              - Vinho
              - Queijo
              - Padaria
              - Outros

        - name: precoMax
          in: query
          description: Preço máximo do produto.
          schema:
            type: number
            minimum: 0

        - name: bio
          in: query
          description: Quando true, devolve apenas produtos biológicos.
          schema:
            type: boolean

        - name: epoca
          in: query
          schema:
            type: string
            enum:
              - Primavera
              - Verão
              - Outono
              - Inverno

        - name: produtor
          in: query
          description: ID do produtor.
          schema:
            type: string

        - name: ordenar
          in: query
          description: Critério de ordenação.
          schema:
            type: string
            enum:
              - recentes
              - preco_asc
              - preco_desc
            default: recentes

      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags: [Produtos]
      summary: Criar produto
      description: Apenas produtores autenticados e validados podem criar produtos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: URL do produto criado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador sem permissão ou produtor ainda não validado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID do produto.
        schema:
          type: string

    get:
      tags: [Produtos]
      summary: Obter detalhe de um produto
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    put:
      tags: [Produtos]
      summary: Atualizar produto
      description: Apenas o produtor proprietário pode atualizar o produto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Produto não encontrado ou não pertence ao produtor autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    delete:
      tags: [Produtos]
      summary: Remover produto
      description: Apenas o produtor proprietário pode remover o produto.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Produto removido

        '401':
          description: Token em falta ou inválido

        '403':
          description: Utilizador sem permissão

        '404':
          description: Produto não encontrado ou não pertence ao produtor autenticado

  /products/{id}/imagem:
    post:
      tags: [Produtos]
      summary: Carregar imagem de um produto
      description: >
        Apenas o produtor proprietário pode carregar a imagem.
        São aceites JPEG, PNG e WebP, com tamanho máximo de 5 MB.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do produto.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagem
              properties:
                imagem:
                  type: string
                  format: binary
                  description: Ficheiro JPEG, PNG ou WebP até 5 MB.
      responses:
        '200':
          description: Imagem guardada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'

        '400':
          description: Imagem em falta, formato não suportado ou ficheiro demasiado grande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido

        '403':
          description: Utilizador sem permissão

        '404':
          description: Produto não encontrado ou não pertence ao produtor autenticado

  /producers:
    get:
      tags: [Produtores]
      summary: Listar produtores públicos
      description: >
        Lista apenas produtores validados.
        É possível filtrar por localidade através de uma pesquisa parcial,
        sem distinção entre maiúsculas e minúsculas.
      parameters:
        - name: localidade
          in: query
          description: Texto a pesquisar na localidade do produtor.
          schema:
            type: string
            example: Ponte de Lima

      responses:
        '200':
          description: Lista de produtores validados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProducerPublic'

  /producers/{id}:
    get:
      tags: [Produtores]
      summary: Obter página pública de um produtor
      description: >
        Devolve o perfil público de um produtor validado,
        os seus produtos com stock disponível e o resumo
        das avaliações visíveis.
      parameters:
        - name: id
          in: path
          required: true
          description: ID do produtor.
          schema:
            type: string

      responses:
        '200':
          description: Dados públicos do produtor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerDetailResponse'

        '404':
          description: Produtor não encontrado ou não validado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Erro:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
          example: Dados inválidos

        detalhes:
          type: object
          additionalProperties:
            type: string

    Localizacao:
      type: object
      properties:
        lat:
          type: number
          example: 41.6918

        lng:
          type: number
          example: -8.8344

    DadosProdutor:
      type: object
      properties:
        nomeExploracao:
          type: string
          example: Horta da Ribeira

        descricao:
          type: string
          maxLength: 1000

        localidade:
          type: string
          example: Ponte de Lima

        localizacao:
          $ref: '#/components/schemas/Localizacao'

        estadoValidacao:
          type: string
          enum:
            - pendente
            - aprovado
            - rejeitado

        validado:
          type: boolean

    User:
      type: object
      required:
        - id
        - nome
        - email
        - papel
      properties:
        id:
          type: string

        nome:
          type: string
          maxLength: 100

        email:
          type: string
          format: email

        papel:
          type: string
          enum:
            - comprador
            - produtor
            - admin

        produtor:
          $ref: '#/components/schemas/DadosProdutor'

    ProdutorRegistoInput:
      type: object
      required:
        - nomeExploracao
        - localidade
      properties:
        nomeExploracao:
          type: string

        localidade:
          type: string

        descricao:
          type: string
          maxLength: 1000

    RegisterInput:
      type: object
      required:
        - nome
        - email
        - password
      properties:
        nome:
          type: string

        email:
          type: string
          format: email

        password:
          type: string
          minLength: 8
          format: password

        papel:
          type: string
          enum:
            - comprador
            - produtor
          default: comprador

        produtor:
          $ref: '#/components/schemas/ProdutorRegistoInput'

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email

        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required:
        - token
        - utilizador
      properties:
        token:
          type: string
          description: Token JWT de autenticação

        utilizador:
          $ref: '#/components/schemas/User'

    ProducerSummary:
      type: object
      properties:
        _id:
          type: string

        nome:
          type: string

        produtor:
          type: object
          properties:
            localidade:
              type: string

            nomeExploracao:
              type: string

        ProducerPublicProfile:
      type: object
      properties:
        nomeExploracao:
          type: string
          example: Horta da Ribeira

        descricao:
          type: string
          example: Produção local de fruta e hortícolas.

        localidade:
          type: string
          example: Ponte de Lima

        localizacao:
          $ref: '#/components/schemas/Localizacao'

    ProducerPublic:
      type: object
      required:
        - id
        - nome
        - produtor
      properties:
        id:
          type: string
          example: 6ac0c6f03e2c9758b3931131

        nome:
          type: string
          example: Horta da Ribeira

        produtor:
          $ref: '#/components/schemas/ProducerPublicProfile'

    ProducerDetailResponse:
      type: object
      required:
        - produtor
        - produtos
        - avaliacaoMedia
        - totalAvaliacoes
      properties:
        produtor:
          $ref: '#/components/schemas/ProducerPublic'

        produtos:
          type: array
          description: Produtos do produtor com stock superior a zero.
          items:
            $ref: '#/components/schemas/Product'

        avaliacaoMedia:
          type: number
          format: double
          nullable: true
          example: 4.5
          description: >
            Média das avaliações visíveis.
            É null quando o produtor ainda não tem avaliações.

        totalAvaliacoes:
          type: integer
          minimum: 0
          example: 2
          description: Número de avaliações visíveis do produtor.

    ProductInput:
      type: object
      required:
        - nome
        - categoria
        - preco
      properties:
        nome:
          type: string
          example: Kiwi Hayward

        descricao:
          type: string
          example: Kiwi fresco de produção local.

        categoria:
          type: string
          enum:
            - Hortícolas
            - Fruta
            - Mel
            - Vinho
            - Queijo
            - Padaria
            - Outros

        preco:
          type: number
          minimum: 0
          example: 2.4

        unidade:
          type: string
          default: kg
          example: kg

        stock:
          type: number
          minimum: 0
          default: 0
          example: 300

        biologico:
          type: boolean
          default: false

        epocas:
          type: array
          items:
            type: string
            enum:
              - Primavera
              - Verão
              - Outono
              - Inverno

    ProductUpdateInput:
      type: object
      properties:
        nome:
          type: string

        descricao:
          type: string

        categoria:
          type: string
          enum:
            - Hortícolas
            - Fruta
            - Mel
            - Vinho
            - Queijo
            - Padaria
            - Outros

        preco:
          type: number
          minimum: 0

        unidade:
          type: string

        stock:
          type: number
          minimum: 0

        biologico:
          type: boolean

        epocas:
          type: array
          items:
            type: string
            enum:
              - Primavera
              - Verão
              - Outono
              - Inverno

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'

        - type: object
          properties:
            _id:
              type: string

            produtor:
              oneOf:
                - type: string
                - $ref: '#/components/schemas/ProducerSummary'

            imagemUrl:
              type: string
              nullable: true

            createdAt:
              type: string
              format: date-time

            updatedAt:
              type: string
              format: date-time

    ImageUploadResponse:
      type: object
      required:
        - imagemUrl
      properties:
        imagemUrl:
          type: string
          example: http://localhost:3000/uploads/exemplo.jpg