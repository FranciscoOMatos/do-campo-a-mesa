openapi: 3.0.3

info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: API REST do mercado digital de produtores locais.

servers:
  - url: http://localhost:3000/api

paths:
  /auth/registo:
    post:
      tags:
        - Autenticação
      summary: Registar utilizador
      description: >
        Cria uma conta de comprador ou produtor.
        Não é permitido criar contas de administrador através deste endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Utilizador registado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: Email já registado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Iniciar sessão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sessão iniciada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/eu:
    get:
      tags:
        - Autenticação
      summary: Obter utilizador autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados públicos do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          description: Token em falta, inválido ou sessão inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /products:
    get:
      tags:
        - Produtos
      summary: Pesquisar produtos
      parameters:
        - name: q
          in: query
          description: Texto no nome
          schema:
            type: string

        - name: categoria
          in: query
          schema:
            type: string

        - name: precoMax
          in: query
          schema:
            type: number

        - name: bio
          in: query
          schema:
            type: boolean

      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Produtos
      summary: Criar produto
      description: Apenas produtores autenticados podem criar produtos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado

        '400':
          description: Dados inválidos

        '401':
          description: Token em falta ou inválido

        '403':
          description: Utilizador sem permissão

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Produtos
      summary: Obter detalhe de um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          description: Produto não encontrado

    put:
      tags:
        - Produtos
      summary: Atualizar produto
      description: Apenas o produtor proprietário pode atualizar o produto.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produto atualizado

        '404':
          description: Produto não encontrado

    delete:
      tags:
        - Produtos
      summary: Remover produto
      description: Apenas o produtor proprietário pode remover o produto.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Produto removido

        '404':
          description: Produto não encontrado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Erro:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
          example: Dados inválidos

        detalhes:
          type: object
          additionalProperties:
            type: string
          example:
            email: Email inválido

    Localizacao:
      type: object
      properties:
        lat:
          type: number
          example: 41.6918

        lng:
          type: number
          example: -8.8344

    DadosProdutor:
      type: object
      properties:
        nomeExploracao:
          type: string
          example: Horta da Ribeira

        descricao:
          type: string
          maxLength: 1000

        localidade:
          type: string
          example: Ponte de Lima

        localizacao:
          $ref: '#/components/schemas/Localizacao'

        estadoValidacao:
          type: string
          enum:
            - pendente
            - aprovado
            - rejeitado

        validado:
          type: boolean

    User:
      type: object
      required:
        - id
        - nome
        - email
        - papel
      properties:
        id:
          type: string
          example: 6ac0c6f03e2c9758b3931131

        nome:
          type: string
          maxLength: 100
          example: João

        email:
          type: string
          format: email
          example: joao@exemplo.pt

        papel:
          type: string
          enum:
            - comprador
            - produtor
            - admin

        produtor:
          $ref: '#/components/schemas/DadosProdutor'

    ProdutorRegistoInput:
      type: object
      required:
        - nomeExploracao
        - localidade
      properties:
        nomeExploracao:
          type: string
          example: Horta da Ribeira

        localidade:
          type: string
          example: Ponte de Lima

        descricao:
          type: string
          maxLength: 1000
          example: Produção local de fruta e hortícolas.

    RegisterInput:
      type: object
      required:
        - nome
        - email
        - password
      properties:
        nome:
          type: string
          example: João Silva

        email:
          type: string
          format: email
          example: joao@exemplo.pt

        password:
          type: string
          minLength: 8
          format: password
          example: password123

        papel:
          type: string
          enum:
            - comprador
            - produtor
          default: comprador

        produtor:
          $ref: '#/components/schemas/ProdutorRegistoInput'

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: joao@exemplo.pt

        password:
          type: string
          format: password
          example: password123

    AuthResponse:
      type: object
      required:
        - token
        - utilizador
      properties:
        token:
          type: string
          description: Token JWT de autenticação

        utilizador:
          $ref: '#/components/schemas/User'

    ProductInput:
      type: object
      required:
        - nome
        - categoria
        - preco
      properties:
        nome:
          type: string
          example: Kiwi Hayward

        categoria:
          type: string
          enum:
            - Hortícolas
            - Fruta
            - Mel
            - Vinho
            - Queijo
            - Padaria
            - Outros

        preco:
          type: number
          example: 2.4

        unidade:
          type: string
          example: kg

        stock:
          type: integer
          example: 300

        biologico:
          type: boolean

        epocas:
          type: array
          items:
            type: string

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'

        - type: object
          properties:
            _id:
              type: string

            produtor:
              type: string
              description: ID do produtor ou objeto populado

            imagemUrl:
              type: string